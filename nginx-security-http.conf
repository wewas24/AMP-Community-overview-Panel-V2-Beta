# Diese Datei wird im http{}-Bereich von Nginx eingebunden, nicht im server{}-Block.
# Beispiel: include /etc/nginx/conf.d/amp-dashboard-security-http.conf;

limit_req_zone $binary_remote_addr zone=amp_dashboard_requests:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=amp_dashboard_per_ip:10m;
