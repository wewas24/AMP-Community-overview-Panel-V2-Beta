# In den bestehenden HTTPS-Serverblock der AMP-Domain einfügen.
# Vorher nginx-security-http.conf im http{}-Bereich von Nginx einbinden.
# Die vorhandene AMP-Konfiguration am Standort / bleibt unverändert.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

location /uebersicht/ {
    limit_req zone=amp_dashboard_requests burst=40 nodelay;
    limit_conn amp_dashboard_per_ip 20;

    proxy_pass http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Client supplied X-Forwarded-For values must never be forwarded as truth.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    # SSE needs an unbuffered, long-lived upstream response. The dashboard
    # sends a heartbeat every 20 seconds and Nginx must not cache it.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    client_max_body_size 3m;

    # Kein proxy_cookie_path. Der sichere __Host-Cookie benötigt Path=/.
}
